          <div class="title-stack">
            <h1 class="title-line title-meatball">MEATBALL</h1>
            <h1 class="title-line title-rain">RAIN</h1>
          </div>
        </div>

        <!-- Tagline / Instructions -->
        <p class="start-tagline">Catch the meatballs.<br>Make the dog happy.</p>

        <!-- Dog Mascot Illustration (140x130) -->
        <div class="dog-start-container">
          <img src="/assets/dog-BEJz-Qcq.svg" alt="Cute dog looking up at meatballs" class="dog-mascot" width="140" height="130">
        </div>

        <!-- START Button -->
        <div class="btn-start-wrapper">
          <button id="btn-start" class="btn-start" type="button">
            START
          </button>
        </div>

        <!-- Footer Caption -->
        <p class="start-caption">Good food. Good dog.</p>

      </div>
    </div>

    <!-- GAMEPLAY ARENA -->
    <div id="game-screen" class="game-screen" style="display: none;">

      <!-- Top Gameplay HUD -->
      <header class="game-hud">
        <div class="hud-score">
          <span class="hud-label">CAUGHT:</span>
          <span id="score-value" class="hud-value">0</span>
        </div>

        <div class="hud-lives" aria-label="Happiness / Lives">
          <span class="hud-label">HAPPINESS:</span>
          <div id="lives-container" class="lives-container">
            <span class="heart-icon active">❤️</span>
            <span class="heart-icon active">❤️</span>
            <span class="heart-icon active">❤️</span>
          </div>
        </div>
      </header>

      <!-- Meatball Falling Arena -->
      <div id="game-arena" class="game-arena">
        <!-- Floating falling meatballs will be injected here dynamically -->

        <!-- Player Dog Sprite -->
        <div id="player-dog" class="player-dog">
          <img src="/assets/dog-BEJz-Qcq.svg" alt="Player Dog" class="player-dog-img" width="140" height="130" draggable="false">
        </div>

        <!-- Ground Line (Crisp 2.5px Hand-Drawn Ink Ground) -->
        <div class="ground-line"></div>
      </div>

      <!-- Controls Bar (Arrow Buttons & Hint) -->
      <div id="game-controls" class="game-controls">
        <div class="arrow-buttons-container">
          <button id="btn-arrow-left" class="arrow-btn" type="button" aria-label="Move left">&larr;</button>
          <button id="btn-arrow-right" class="arrow-btn" type="button" aria-label="Move right">&rarr;</button>
        </div>
        <div class="game-controls-hint">
          <span class="hint-desktop">Move with <kbd>&larr;</kbd> <kbd>&rarr;</kbd> / <kbd>A</kbd> <kbd>D</kbd> or Gamepad</span>
          <span class="hint-mobile">Drag screen or tap arrow buttons</span>
        </div>
      </div>

    </div>

    <!-- GAME OVER SCREEN MODAL -->
    <div id="game-over-screen" class="screen-overlay game-over-screen" style="display: none;">
      <div class="game-over-card">
        <h2 class="game-over-title">GAME OVER</h2>
        <p class="game-over-subtitle">The dog got hungry!</p>

        <div class="game-over-stats">
          <div class="stat-row">
            <span class="stat-label">Meatballs Caught:</span>
            <span id="final-score" class="stat-value">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Best Score:</span>
            <span id="best-score" class="stat-value">0</span>
          </div>
        </div>

        <div class="btn-start-wrapper">
          <button id="btn-restart" class="btn-start" type="button">
            PLAY AGAIN
          </button>
        </div>

        <p class="start-caption">Good food. Good dog.</p>
      </div>
    </div>

  </div>

</body>
